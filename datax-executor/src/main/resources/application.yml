# web port
server:
  port: 18081


# log config
logging:
  config: classpath:logback.xml
  path: ${data.path:./data}/applogs/executor/jobhandler

datax:
  job:
    admin:
      ### datax admin address list, such as "http://address" or "http://address01,http://address02"
      addresses: http://127.0.0.1:${datax.admin.port:18080}
    executor:
      appname: datax-executor
      ip:
      port: ${executor.port:9999}
      ### job log path
      logpath: ${data.path:./data}/applogs/executor/jobhandler
      ### job log retention days
      logretentiondays: 30
    ### job, access token
    accessToken:

  executor:
    jsonpath: ${json.path:./data/executor/json/}
  pypath: ${python.path}
